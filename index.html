<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樣鞋房雙系統管理帳本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
        tr.lent-row { background-color: rgba(255, 247, 237, 0.5); }
        tr.overdue-row { background-color: rgba(254, 226, 226, 0.8); animation: pulse-bg 2s infinite; }
        @keyframes pulse-bg { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .filter-select, .filter-input {
            width: 100%; font-size: 10px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 4px;
        }
        
        .table-wrapper { height: calc(100vh - 220px); overflow: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { border-collapse: separate; border-spacing: 0; min-width: 1350px; }
        thead th { position: sticky; top: 0; background: #f8fafc; z-index: 10; border-bottom: 2px solid #e2e8f0; }
        .filter-row th { position: sticky; top: 37px; background: #f8fafc; z-index: 9; border-bottom: 1px solid #e2e8f0; }
        
        /* 欄位寬度設定 */
        .col-stt { width: 50px; }
        .col-status { width: 80px; }
        .col-brand { width: 100px; }
        .col-style { width: 150px; }
        .col-color { width: 100px; }
        .col-season { width: 80px; }
        .col-date { width: 85px; }
        .col-days { width: 50px; }
        .col-person { width: 120px; }
        .col-action { width: 100px; }

        /* 操作分頁樣式 */
        .tab-btn { padding: 12px 0; font-weight: 800; font-size: 14px; flex: 1; text-align: center; border-bottom: 2px solid transparent; color: #94a3b8; transition: all 0.3s; }
        .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; background: #eff6ff; }
        .action-pane { display: none; padding: 24px; }
        .action-pane.active { display: block; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-2">

    <div class="max-w-full mx-auto">
        <!-- 頂部切換與統計 -->
        <div class="flex flex-col md:flex-row justify-between items-end gap-2 mb-2">
            <div class="flex gap-2">
                <button id="tabConfirm" onclick="switchMode('confirm')" class="px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-blue-600 text-blue-600 transition-all">確認鞋 (Confirm)</button>
                <button id="tabFitting" onclick="switchMode('fitting')" class="px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-500 transition-all">FITTING鞋 (Fitting)</button>
            </div>
            <div id="statPanel" class="flex gap-4 text-[10px] font-bold bg-white px-4 py-1.5 rounded-lg border shadow-sm mb-1">
                <span class="text-slate-500">總數: <span id="statTotal">0</span></span>
                <span class="text-orange-600">外借中: <span id="statLent">0</span></span>
                <span class="text-red-600">逾期: <span id="statOverdue">0</span></span>
            </div>
        </div>

        <!-- 功能列 -->
        <div class="bg-white p-3 rounded-xl shadow-sm border mb-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 id="titleDisplay" class="text-base font-black flex items-center gap-2 text-slate-700 uppercase">
                    <i data-lucide="layout-list"></i> 確認鞋管理
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex gap-3 border-r pr-4 border-slate-200">
                    <button onclick="exportToCSV()" class="text-[11px] font-bold text-slate-400 hover:text-emerald-600 transition-colors uppercase tracking-tight">匯出報表</button>
                    <button onclick="openModal('importModal')" class="text-[11px] font-bold text-slate-400 hover:text-slate-600 transition-colors uppercase tracking-tight">匯入資料</button>
                </div>
                <button onclick="openActionModal()" class="flex items-center gap-1.5 bg-blue-600 text-white px-5 py-2 rounded-lg text-xs font-bold hover:bg-blue-700 shadow-md transition-all active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4"></i> 新增借出
                </button>
            </div>
        </div>

        <!-- 主表格區 -->
        <div class="table-wrapper bg-white shadow-inner">
            <table id="mainTable">
                <thead>
                    <tr class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">
                        <th class="p-2 col-stt">STT</th>
                        <th class="p-2 col-status">狀態</th>
                        <th class="p-2 col-brand">Brand</th>
                        <th class="p-2 col-style">Style #</th>
                        <th class="p-2 col-color">Colorway</th>
                        <th class="p-2 col-season">Season</th>
                        <th class="p-2 col-date">借出日期</th>
                        <th class="p-2 col-days">天數</th>
                        <th class="p-2 col-person">借用人</th>
                        <th class="p-2 col-date">歸還日期</th>
                        <th class="p-2 col-person">簽收狀態</th>
                        <th class="p-2 col-action text-center">操作</th>
                    </tr>
                    <tr class="filter-row">
                        <th class="p-1"><input type="text" class="filter-input" oninput="applyFilter(0, this.value)" placeholder="No."></th>
                        <th class="p-1">
                            <select class="filter-select" onchange="applyFilter(1, this.value)">
                                <option value="">全部</option>
                                <option value="外借中">外借中</option>
                                <option value="已結案">已結案</option>
                                <option value="逾期">逾期</option>
                            </select>
                        </th>
                        <th class="p-1"><select id="f_brand" class="filter-select" onchange="applyFilter(2, this.value)"><option value="">全部</option></select></th>
                        <th class="p-1"><input type="text" class="filter-input" oninput="applyFilter(3, this.value)" placeholder="型號搜尋"></th>
                        <th class="p-1"><input type="text" class="filter-input" oninput="applyFilter(4, this.value)" placeholder="顏色"></th>
                        <th class="p-1"><select id="f_season" class="filter-select" onchange="applyFilter(5, this.value)"><option value="">全部</option></select></th>
                        <th class="p-1"></th>
                        <th class="p-1"></th>
                        <th class="p-1"><select id="f_borrower" class="filter-select" onchange="applyFilter(8, this.value)"><option value="">全部</option></select></th>
                        <th class="p-1"></th>
                        <th class="p-1"></th>
                        <th class="p-1"></th>
                    </tr>
                </thead>
                <tbody id="ledgerBody" class="text-[11px] font-medium divide-y divide-slate-100">
                    <!-- JS Render -->
                </tbody>
            </table>
            <div id="emptyState" class="p-10 text-center text-slate-300 italic text-xs hidden">目前此類別帳本尚無資料</div>
        </div>
        <p class="text-[10px] text-slate-400 mt-2 italic px-2">提示：對著型體「左鍵雙擊」可開啟操作中心進行歸還或再次借出。</p>
    </div>

    <!-- 操作中心彈窗 (核心升級：借還一體化) -->
    <div id="actionModal" class="modal fixed inset-0 bg-black/60 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden">
            <!-- 標籤切換 -->
            <div class="flex border-b border-slate-100 bg-slate-50/50">
                <button id="tabLoan" onclick="switchActionTab('loan')" class="tab-btn active">
                    <i data-lucide="copy-plus" class="inline-block w-4 h-4 mr-1"></i> 新增借出記錄
                </button>
                <button id="tabReturn" onclick="switchActionTab('return')" class="tab-btn">
                    <i data-lucide="check-square" class="inline-block w-4 h-4 mr-1"></i> 簽收歸還結案
                </button>
                <button onclick="closeModal('actionModal')" class="px-4 text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- 型體基本資訊顯示區 -->
            <div class="px-6 py-3 bg-blue-50/50 border-b border-blue-100 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span id="displayBrand" class="font-black text-blue-800"></span>
                    <span id="displayStyle" class="font-mono font-black text-blue-600 border-l pl-3 border-blue-200"></span>
                </div>
                <span id="displaySeason" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"></span>
            </div>

            <!-- 分頁1: 新增借出 -->
            <div id="paneLoan" class="action-pane active">
                <form id="addForm" class="grid grid-cols-2 gap-4 text-xs font-semibold">
                    <div class="col-span-1 space-y-1"><label class="text-slate-400">品牌 Brand</label><input type="text" id="a_brand" class="w-full border p-2.5 rounded outline-none focus:ring-2 focus:ring-blue-500 transition-all" required></div>
                    <div class="col-span-1 space-y-1"><label class="text-slate-400">型號 Style #</label><input type="text" id="a_style" class="w-full border p-2.5 rounded outline-none focus:ring-2 focus:ring-blue-500 transition-all" required></div>
                    <div class="col-span-1 space-y-1"><label class="text-slate-400">顏色 Colorway</label><input type="text" id="a_color" class="w-full border p-2.5 rounded outline-none"></div>
                    <div class="col-span-1 space-y-1"><label class="text-slate-400">季節 Season</label><input type="text" id="a_season" class="w-full border p-2.5 rounded outline-none" value="FA25"></div>
                    <div class="col-span-1 space-y-1"><label class="text-slate-400">借出日期 (M/D)</label><input type="text" id="a_loan" class="w-full border p-2.5 rounded outline-none"></div>
                    <div class="col-span-1 space-y-1"><label class="text-slate-400">天數 Expected</label><input type="number" id="a_days" class="w-full border p-2.5 rounded outline-none" value="2"></div>
                    <div class="col-span-1 space-y-1"><label class="text-slate-400 font-bold text-blue-600">借用人 By (必填)</label><input type="text" id="a_borrower" class="w-full border-2 border-blue-100 p-2.5 rounded outline-none focus:border-blue-500" required></div>
                    <div class="col-span-1 space-y-1"><label class="text-slate-400">確認人 Confirmed</label><input type="text" id="a_confirmer" class="w-full border p-2.5 rounded outline-none"></div>
                    <div class="col-span-2 pt-4"><button type="submit" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-black uppercase tracking-widest shadow-lg hover:bg-blue-700 active:scale-[0.98] transition-all">確認借出並記錄</button></div>
                </form>
            </div>

            <!-- 分頁2: 簽收歸還 -->
            <div id="paneReturn" class="action-pane">
                <div id="returnStatusNotice" class="mb-4 hidden text-center p-3 rounded-lg bg-emerald-50 text-emerald-700 font-bold text-xs">該筆樣鞋已於 <span id="returnNoteDate"></span> 歸還完畢</div>
                <form id="retForm" class="space-y-4 text-xs font-semibold">
                    <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100 mb-2">
                        <div><p class="text-slate-400 uppercase text-[10px]">原借用人</p><p id="r_display_borrower" class="text-sm font-black text-slate-700"></p></div>
                        <div><p class="text-slate-400 uppercase text-[10px]">借出日期</p><p id="r_display_date" class="text-sm font-black text-slate-700"></p></div>
                    </div>
                    <div class="space-y-1"><label class="text-slate-400">實際歸還日期 (M/D)</label><input type="text" id="r_date" class="w-full border p-3 rounded-xl font-black outline-none focus:ring-2 focus:ring-green-500"></div>
                    <div class="space-y-1"><label class="text-slate-400">簽收確認人員 (助理)</label><input type="text" id="r_conf" class="w-full border p-3 rounded-xl font-black outline-none focus:ring-2 focus:ring-green-500" value="助理已收"></div>
                    <button type="submit" id="submitReturnBtn" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-black tracking-widest mt-2 hover:bg-green-700 active:scale-[0.98] transition-all shadow-lg">確認簽收歸還</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 彈窗：匯入 -->
    <div id="importModal" class="modal fixed inset-0 bg-black/60 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-slate-800">匯入資料</h2><button onclick="closeModal('importModal')"><i data-lucide="x"></i></button></div>
            <div class="space-y-4 text-sm">
                <select id="encoding" class="w-full p-2 border rounded font-bold">
                    <option value="UTF-8">編碼: UTF-8 (預設)</option>
                    <option value="Big5">編碼: Big5 (繁體 Excel)</option>
                </select>
                <div onclick="document.getElementById('fileIn').click()" class="border-2 border-dashed border-slate-200 p-8 text-center rounded-xl cursor-pointer hover:bg-slate-50 transition-all">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">點擊選擇 CSV</p>
                    <input type="file" id="fileIn" class="hidden" accept=".csv" onchange="handleImport(event)">
                </div>
            </div>
        </div>
    </div>

    <!-- 刪除確認 -->
    <div id="deleteModal" class="modal fixed inset-0 bg-black/70 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-2xl text-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="alert-triangle" class="w-8 h-8"></i></div>
            <h2 class="font-bold text-lg text-slate-800 mb-1">確定要刪除嗎？</h2>
            <p class="text-[11px] text-slate-400 mb-6">此記錄刪除後將無法恢復。</p>
            <div class="flex gap-3">
                <button onclick="closeModal('deleteModal')" class="flex-1 py-2 bg-slate-100 text-slate-500 rounded-lg font-bold text-xs hover:bg-slate-200">取消</button>
                <button id="confirmDeleteBtn" class="flex-1 py-2 bg-red-600 text-white rounded-lg font-bold text-xs hover:bg-red-700 shadow-md">確定刪除</button>
            </div>
        </div>
    </div>

    <script>
        let dataStore = { confirm: [], fitting: [] };
        let currentMode = 'confirm';
        let currentRecord = null; // 當前操作的完整記錄對象
        let filters = {};

        window.onload = () => {
            const saved = localStorage.getItem('sampleRoomLedger');
            if (saved) { try { dataStore = JSON.parse(saved); } catch(e) { console.error("Data error", e); } }
            switchMode('confirm');
            lucide.createIcons();
        };

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tabConfirm').className = (mode === 'confirm') ? 'px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-blue-600 text-blue-600' : 'px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-500';
            document.getElementById('tabFitting').className = (mode === 'fitting') ? 'px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-orange-600 text-orange-600' : 'px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-500';
            
            const title = document.getElementById('titleDisplay');
            if (title) {
                title.innerHTML = `<i data-lucide="${mode === 'confirm' ? 'layout-list' : 'zap'}" class="${mode === 'confirm' ? 'text-blue-600' : 'text-orange-500'} w-5 h-5"></i> ${mode === 'confirm' ? '確認鞋管理 (Confirm)' : 'FITTING鞋管理 (Fitting)'}`;
                lucide.createIcons();
            }
            filters = {};
            document.querySelectorAll('.filter-input, .filter-select').forEach(i => i.value = '');
            renderTable();
        }

        // 切換操作分頁 (借出/歸還)
        function switchActionTab(tab) {
            document.getElementById('tabLoan').classList.toggle('active', tab === 'loan');
            document.getElementById('tabReturn').classList.toggle('active', tab === 'return');
            document.getElementById('paneLoan').classList.toggle('active', tab === 'loan');
            document.getElementById('paneReturn').classList.toggle('active', tab === 'return');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function getMD() { const d = new Date(); return `${d.getMonth() + 1}/${d.getDate()}`; }

        // 操作中心彈窗 (新增/再次借出 + 歸還)
        function openActionModal(record = null) {
            currentRecord = record;
            const max = dataStore[currentMode].reduce((m, r) => Math.max(m, parseInt(r.stt) || 0), 0);
            
            // 更新頂部型體資訊顯示
            document.getElementById('displayBrand').innerText = record ? record.brand : '-';
            document.getElementById('displayStyle').innerText = record ? record.style : 'New Entry';
            document.getElementById('displaySeason').innerText = record ? record.season : '';

            // --- 準備：再次借出 分頁 ---
            if (record) {
                document.getElementById('a_brand').value = record.brand;
                document.getElementById('a_style').value = record.style;
                document.getElementById('a_color').value = record.color;
                document.getElementById('a_season').value = record.season;
                document.getElementById('a_borrower').value = ''; 
                document.getElementById('a_confirmer').value = '';
            } else {
                document.getElementById('addForm').reset();
                document.getElementById('a_season').value = 'FA25';
            }
            document.getElementById('a_loan').value = getMD();
            document.getElementById('a_days').value = 2;

            // --- 準備：歸還 分頁 ---
            if (record) {
                document.getElementById('r_display_borrower').innerText = record.borrower;
                document.getElementById('r_display_date').innerText = record.loanDate;
                document.getElementById('r_date').value = getMD();
                document.getElementById('r_conf').value = '助理已收';
                
                // 如果已經歸還了，顯示提示
                const isReturned = record.returnDate && record.returnDate.trim() !== '';
                document.getElementById('returnStatusNotice').classList.toggle('hidden', !isReturned);
                if (isReturned) document.getElementById('returnNoteDate').innerText = record.returnDate;
                document.getElementById('submitReturnBtn').classList.toggle('hidden', isReturned);
                
                // 智慧分頁導向：外借中選還，已還選借
                switchActionTab(isReturned ? 'loan' : 'return');
            } else {
                switchActionTab('loan');
                document.getElementById('tabReturn').style.opacity = '0.3';
                document.getElementById('tabReturn').style.pointerEvents = 'none';
            }

            // 綁定儲存事件
            document.getElementById('addForm').onsubmit = (e) => {
                e.preventDefault();
                dataStore[currentMode].unshift({
                    id: Date.now(), stt: max + 1,
                    brand: document.getElementById('a_brand').value,
                    style: document.getElementById('a_style').value,
                    color: document.getElementById('a_color').value,
                    season: document.getElementById('a_season').value,
                    loanDate: document.getElementById('a_loan').value,
                    expected: document.getElementById('a_days').value,
                    borrower: document.getElementById('a_borrower').value,
                    confirmerLoan: document.getElementById('a_confirmer').value,
                    returnDate: '', returnedBy: '', confirmerReturn: ''
                });
                save(); renderTable(); closeModal('actionModal');
            };

            document.getElementById('retForm').onsubmit = (e) => {
                e.preventDefault();
                if (!currentRecord) return;
                const r = dataStore[currentMode].find(x => x.id === currentRecord.id);
                r.returnDate = document.getElementById('r_date').value;
                r.returnedBy = r.borrower;
                r.confirmerReturn = document.getElementById('r_conf').value;
                save(); renderTable(); closeModal('actionModal');
            };

            openModal('actionModal');
        }

        function openDel(id) {
            currentRecord = dataStore[currentMode].find(x => x.id === id);
            document.getElementById('confirmDeleteBtn').onclick = () => {
                dataStore[currentMode] = dataStore[currentMode].filter(x => x.id !== currentRecord.id);
                save(); renderTable(); closeModal('deleteModal');
            };
            openModal('deleteModal');
        }

        function save() { localStorage.setItem('sampleRoomLedger', JSON.stringify(dataStore)); }
        function applyFilter(idx, val) { filters[idx] = val.toLowerCase(); renderTable(); }

        function updateSelects() {
            const items = dataStore[currentMode];
            const fill = (id, list) => {
                const s = document.getElementById(id); if (!s) return;
                const cur = s.value;
                s.innerHTML = '<option value="">全部</option>';
                [...new Set(list)].filter(Boolean).sort().forEach(v => s.innerHTML += `<option value="${v}">${v}</option>`);
                s.value = cur;
            };
            fill('f_brand', items.map(i => i.brand)); 
            fill('f_season', items.map(i => i.season)); 
            fill('f_borrower', items.map(i => i.borrower));
        }

        function isOverdue(loanDate, days) {
            if (!loanDate || !days) return false;
            try {
                const today = new Date();
                const [m, d] = loanDate.split('/').map(Number);
                const loan = new Date(today.getFullYear(), m - 1, d);
                loan.setDate(loan.getDate() + parseInt(days));
                return today > loan;
            } catch(e) { return false; }
        }

        function renderTable() {
            const body = document.getElementById('ledgerBody');
            if (!body) return;
            body.innerHTML = '';
            updateSelects();

            let lentCount = 0, overdueCount = 0;
            const list = dataStore[currentMode].filter(r => {
                const statusStr = (!r.returnDate) ? (isOverdue(r.loanDate, r.expected) ? '逾期' : '外借中') : '已結案';
                const row = [r.stt, statusStr, r.brand, r.style, r.color, r.season, r.loanDate, r.expected, r.borrower, r.returnDate, (r.returnedBy + r.confirmerReturn)];
                return Object.keys(filters).every(k => !filters[k] || row[k].toString().toLowerCase().includes(filters[k]));
            });

            list.forEach(r => {
                const isLent = !r.returnDate || r.returnDate.trim() === '';
                const overdue = isLent && isOverdue(r.loanDate, r.expected);
                if (isLent) lentCount++;
                if (overdue) overdueCount++;

                const tr = document.createElement('tr');
                tr.className = "cursor-pointer transition-all hover:bg-slate-50";
                if (overdue) tr.classList.add('overdue-row');
                else if (isLent) tr.classList.add('lent-row');

                // 核心：雙擊開啟操作中心
                tr.ondblclick = () => openActionModal(r);

                tr.innerHTML = `
                    <td class="p-2 text-slate-400 font-mono">${r.stt}</td>
                    <td class="p-2">
                        ${isLent ? (overdue ? '<span class="text-[9px] bg-red-600 text-white px-1.5 py-0.5 rounded font-black">逾期中</span>' : '<span class="text-[9px] bg-orange-100 text-orange-600 px-1.5 py-0.5 rounded font-bold">外借中</span>') : '<span class="text-[9px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-bold">已結案</span>'}
                    </td>
                    <td class="p-2 font-bold">${r.brand}</td>
                    <td class="p-2 font-mono text-blue-600 font-bold">${r.style}</td>
                    <td class="p-2 text-slate-500">${r.color}</td>
                    <td class="p-2 text-slate-400">${r.season}</td>
                    <td class="p-2 text-slate-400">${r.loanDate}</td>
                    <td class="p-2 text-center text-slate-300 font-bold">${r.expected}</td>
                    <td class="p-2 font-bold text-slate-700">${r.borrower}</td>
                    <td class="p-2 text-green-600 font-black">${r.returnDate || '--'}</td>
                    <td class="p-2 text-[10px] text-slate-400">
                        ${r.returnDate ? `<div>${r.returnedBy}<br><span class="opacity-50">簽: ${r.confirmerReturn}</span></div>` : '待收'}
                    </td>
                    <td class="p-2 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="event.stopPropagation(); openActionModal(JSON.parse('${JSON.stringify(r).replace(/'/g, "\\'")}'))" class="text-slate-400 hover:text-blue-600 transition-all"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
                            <button onclick="event.stopPropagation(); openDel(${r.id})" class="text-slate-200 hover:text-red-500 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                `;
                body.appendChild(tr);
            });

            document.getElementById('statTotal').innerText = dataStore[currentMode].length;
            document.getElementById('statLent').innerText = lentCount;
            document.getElementById('statOverdue').innerText = overdueCount;
            document.getElementById('emptyState').className = (list.length === 0) ? 'p-10 text-center text-slate-300 italic text-xs' : 'hidden';
            lucide.createIcons();
        }

        function handleImport(e) {
            const file = e.target.files[0];
            const enc = document.getElementById('encoding').value;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const lines = evt.target.result.split(/\r?\n/).filter(l => l.trim());
                const news = lines.slice(1).map(l => {
                    const c = l.split(',').map(s => s.replace(/"/g, '').trim());
                    return {
                        id: Date.now() + Math.random(),
                        stt: c[0] || '', brand: c[1] || '', style: c[2] || '', color: c[3] || '', season: c[4] || '',
                        loanDate: c[5] || '', expected: c[6] || '', borrower: c[7] || '', confirmerLoan: c[8] || '',
                        returnDate: c[9] || '', returnedBy: c[10] || '', confirmerReturn: c[11] || ''
                    };
                });
                dataStore[currentMode] = [...news, ...dataStore[currentMode]];
                save(); renderTable(); closeModal('importModal');
            };
            reader.readAsText(file, enc);
        }

        function exportToCSV() {
            const headers = "STT(No.),Brand(Thương hiệu),Style #/Name(Tên hình thức),Colorway(Màu sắc),Season(Mùa),Loan-out Date(Ngày mượn),Expected Date(Dự kiến trả),Borrowed by(Người mượn),Confirmed by(Ký tên),Return Date(Ngày trả),Returned by(Người trả),Confirmed by(Ký tên)";
            const rows = dataStore[currentMode].map(r => 
                [r.stt, r.brand, r.style, r.color, r.season, r.loanDate, r.expected, r.borrower, r.confirmerLoan, r.returnDate, r.returnedBy, r.confirmerReturn].join(',')
            );
            const csv = "\ufeff" + headers + "\n" + rows.join("\n");
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `${currentMode}_ledger_${getMD().replace('/','-')}.csv`);
            link.click();
        }
    </script>
</body>
</html>
