<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樣鞋房雙系統管理帳本 (雲端同步版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase 核心設定 ---
        const myFirebaseConfig = {
            apiKey: "AIzaSyBEZPT-gedfUMnwSiSuVY4aXuNNqWHxilA",
            authDomain: "shoe-factory-ledger.firebaseapp.com",
            projectId: "shoe-factory-ledger",
            storageBucket: "shoe-factory-ledger.firebasestorage.app",
            messagingSenderId: "380748962069",
            appId: "1:380748962069:web:bb37fe839b5cdf3c86b11c"
        };

        // 環境判斷：優先使用動態配置以確保在預覽環境與 GitHub 都能運行
        const firebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config !== "") ? JSON.parse(__firebase_config) : myFirebaseConfig;
        const appId = (typeof __app_id !== 'undefined' && __app_id !== "") ? __app_id : 'shoe-factory-manager-ledger';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 全域狀態
        window.dataStore = { confirm: [], fitting: [] };
        window.currentMode = 'confirm';
        window.isAuthReady = false;
        let filters = {};
        let currentRecord = null;
        let isSyncing = false;

        // --- 核心：認證程序 (符合 Rule 3 - 必須先 Auth 才能 Query) ---
        async function initApp() {
            const syncText = document.getElementById('syncText');
            const errorLog = document.getElementById('errorLog');

            try {
                // 1. 認證處理：支援自定義 Token 與 匿名登入
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // 2. 監聽認證狀態：確認身份後才啟動監聽器
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        console.log("連線成功:", user.uid);
                        window.isAuthReady = true;
                        if (!isSyncing) {
                            startSyncing();
                            isSyncing = true;
                        }
                    } else {
                        window.isAuthReady = false;
                    }
                });
            } catch (err) {
                console.error("Auth Error:", err);
                syncText.innerText = "認證失敗";
                showError(`[認證錯誤] ${err.code}\n請檢查 Firebase Authentication 是否已啟用「匿名登入」。`);
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorLog');
            if (el) {
                el.innerText = msg;
                el.classList.remove('hidden');
            }
        }

        // --- 資料同步 (符合 Rule 1 - 嚴格路徑結構) ---
        function startSyncing() {
            const syncIndicator = document.getElementById('syncIndicator');
            const syncText = document.getElementById('syncText');

            // 路徑：/artifacts/{appId}/public/data/{collectionName}
            const getColl = (mode) => collection(db, 'artifacts', appId, 'public', 'data', `${mode}_ledger`);

            const handleUpdate = (mode, snapshot) => {
                window.dataStore[mode] = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                if (syncIndicator) {
                    syncIndicator.className = "flex items-center gap-1.5 text-emerald-500 font-bold";
                    syncText.innerText = "雲端同步中";
                }
                window.renderTable();
            };

            const handleError = (mode, err) => {
                console.error(`${mode} Sync Error:`, err);
                // 顯示具體權限錯誤指引
                if (err.code === 'permission-denied') {
                    showError(`[權限拒絕] 路徑不匹配或規則未設定。\n目前的 appId: ${appId}\n請確保 Firestore Rules 包含對應的路徑規則。`);
                }
            };

            onSnapshot(getColl('confirm'), (s) => handleUpdate('confirm', s), (e) => handleError('confirm', e));
            onSnapshot(getColl('fitting'), (s) => handleUpdate('fitting', s), (e) => handleError('fitting', e));
        }

        // --- 資料庫動作 (符合 Rule 3 Guard) ---
        window.dbActions = {
            async add(data) {
                if (!window.isAuthReady) return;
                const coll = collection(db, 'artifacts', appId, 'public', 'data', `${window.currentMode}_ledger`);
                await addDoc(coll, data);
            },
            async update(id, updates) {
                if (!window.isAuthReady) return;
                const dRef = doc(db, 'artifacts', appId, 'public', 'data', `${window.currentMode}_ledger`, id);
                await updateDoc(dRef, updates);
            },
            async delete(id) {
                if (!window.isAuthReady) return;
                const dRef = doc(db, 'artifacts', appId, 'public', 'data', `${window.currentMode}_ledger`, id);
                await deleteDoc(dRef);
            }
        };

        // --- UI 控制項 ---
        window.switchMode = function(mode) {
            window.currentMode = mode;
            document.getElementById('tabConfirm').className = (mode === 'confirm') ? 'px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-blue-600 text-blue-600 transition-all' : 'px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-500 transition-all';
            document.getElementById('tabFitting').className = (mode === 'fitting') ? 'px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-orange-600 text-orange-600 transition-all' : 'px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-500 transition-all';
            const title = document.getElementById('titleDisplay');
            if (title) {
                title.innerHTML = `<i data-lucide="${mode === 'confirm' ? 'layout-list' : 'zap'}" class="${mode === 'confirm' ? 'text-blue-600' : 'text-orange-500'} w-5 h-5"></i> ${mode === 'confirm' ? '確認鞋管理' : 'FITTING鞋管理'}`;
                lucide.createIcons();
            }
            filters = {};
            document.querySelectorAll('.filter-input, .filter-select').forEach(i => i.value = '');
            window.renderTable();
        };

        window.renderTable = function() {
            const body = document.getElementById('ledgerBody');
            if (!body) return;
            body.innerHTML = '';
            const items = window.dataStore[window.currentMode] || [];
            
            const fill = (id, list) => {
                const s = document.getElementById(id); if (!s) return;
                const cur = s.value;
                s.innerHTML = '<option value="">全部</option>';
                [...new Set(list)].filter(Boolean).sort().forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v; opt.innerText = v; s.appendChild(opt);
                });
                s.value = cur;
            };
            fill('f_brand', items.map(i => i.brand)); 
            fill('f_season', items.map(i => i.season)); 
            fill('f_borrower', items.map(i => i.borrower));

            const isOverdue = (l, days) => {
                if (!l || !days) return false;
                const t = new Date(); const p = l.split('/'); if (p.length < 2) return false;
                const ln = new Date(t.getFullYear(), parseInt(p[0]) - 1, parseInt(p[1]));
                ln.setDate(ln.getDate() + parseInt(days)); return t > ln;
            };

            const filtered = items.filter(r => {
                const statusStr = (!r.returnDate || r.returnDate.trim() === '') ? (isOverdue(r.loanDate, r.expected) ? '逾期' : '外借中') : '已結案';
                const row = [r.stt, statusStr, r.brand, r.style, r.color, r.season, r.loanDate, r.expected, r.borrower, r.returnDate, (r.returnedBy + r.confirmerReturn)];
                return Object.keys(filters).every(k => !filters[k] || row[k]?.toString().toLowerCase().includes(filters[k]));
            });

            filtered.forEach(r => {
                const isLent = !r.returnDate || r.returnDate.trim() === '';
                const overdue = isLent && isOverdue(r.loanDate, r.expected);
                const tr = document.createElement('tr');
                tr.className = "cursor-pointer transition-all hover:bg-slate-50 text-[11px]";
                if (overdue) tr.classList.add('bg-red-50/50');
                else if (isLent) tr.classList.add('bg-orange-50/20');
                
                tr.ondblclick = () => window.openActionModal(r);

                tr.innerHTML = `
                    <td class="p-2 text-slate-400 font-mono">${r.stt}</td>
                    <td class="p-2">
                        ${isLent ? (overdue ? '<span class="px-2 py-0.5 rounded-full bg-red-100 text-red-600 font-bold text-[9px]">逾期</span>' : '<span class="px-2 py-0.5 rounded-full bg-orange-100 text-orange-600 font-bold text-[9px]">外借中</span>') : '<span class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-bold text-[9px]">已結案</span>'}
                    </td>
                    <td class="p-2 font-bold text-slate-700">${r.brand || ''}</td>
                    <td class="p-2 font-mono text-blue-600 font-bold">${r.style || ''}</td>
                    <td class="p-2 text-slate-500">${r.color || ''}</td>
                    <td class="p-2 text-slate-400 text-[10px] uppercase">${r.season || ''}</td>
                    <td class="p-2 text-slate-400 font-mono text-[10px]">${r.loanDate || ''}</td>
                    <td class="p-2 text-center text-slate-300 font-bold">${r.expected || ''}</td>
                    <td class="p-2 font-bold text-slate-700">${r.borrower || ''}</td>
                    <td class="p-2 text-green-600 font-black">${r.returnDate || '--'}</td>
                    <td class="p-2 text-[10px] text-slate-400">
                        ${r.returnDate ? `<div>${r.returnedBy}<br><span class="opacity-50 italic text-[9px]">簽: ${r.confirmerReturn}</span></div>` : '待收'}
                    </td>
                    <td class="p-2 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="event.stopPropagation(); window.openActionModal(JSON.parse('${JSON.stringify(r).replace(/'/g, "\\'")}'))" class="text-slate-300 hover:text-blue-600 transition-all"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
                            <button onclick="event.stopPropagation(); window.openDel('${r.id}')" class="text-slate-200 hover:text-red-500 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                `;
                body.appendChild(tr);
            });

            document.getElementById('statTotal').innerText = items.length;
            const es = document.getElementById('emptyState'); if (es) es.className = (filtered.length === 0) ? 'p-10 text-center text-slate-300 italic text-xs' : 'hidden';
            lucide.createIcons();
        }

        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        window.applyFilter = (idx, val) => { filters[idx] = val.toLowerCase(); window.renderTable(); };
        window.switchActionTab = (tab) => {
            document.getElementById('tabLoan').classList.toggle('active', tab === 'loan');
            document.getElementById('tabReturn').classList.toggle('active', tab === 'return');
            document.getElementById('paneLoan').classList.toggle('active', tab === 'loan');
            document.getElementById('paneReturn').classList.toggle('active', tab === 'return');
        };

        window.openActionModal = function(record = null) {
            currentRecord = record;
            const items = window.dataStore[window.currentMode] || [];
            const max = items.reduce((m, r) => Math.max(m, parseInt(r.stt) || 0), 0);
            document.getElementById('displayBrand').innerText = record ? record.brand : '-';
            document.getElementById('displayStyle').innerText = record ? record.style : '新增流水帳';
            if (record) {
                document.getElementById('a_brand').value = record.brand;
                document.getElementById('a_style').value = record.style;
                document.getElementById('a_color').value = record.color;
                document.getElementById('a_season').value = record.season;
                document.getElementById('a_borrower').value = ''; 
                document.getElementById('r_display_borrower').innerText = record.borrower;
                document.getElementById('r_display_date').innerText = record.loanDate;
                document.getElementById('r_date').value = getMD();
                const isRet = record.returnDate && record.returnDate.trim() !== '';
                document.getElementById('returnStatusNotice').classList.toggle('hidden', !isRet);
                document.getElementById('submitReturnBtn').classList.toggle('hidden', isRet);
                window.switchActionTab(isRet ? 'loan' : 'return');
                document.getElementById('tabReturn').style.opacity = '1';
                document.getElementById('tabReturn').style.pointerEvents = 'auto';
            } else {
                document.getElementById('addForm').reset();
                document.getElementById('a_season').value = 'FA25';
                window.switchActionTab('loan');
                document.getElementById('tabReturn').style.opacity = '0.3';
                document.getElementById('tabReturn').style.pointerEvents = 'none';
            }
            document.getElementById('a_loan').value = getMD();
            document.getElementById('a_days').value = 2;
            window.openModal('actionModal');
        };

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const items = window.dataStore[window.currentMode] || [];
            const max = items.reduce((m, r) => Math.max(m, parseInt(r.stt) || 0), 0);
            await window.dbActions.add({
                stt: max + 1, brand: document.getElementById('a_brand').value, style: document.getElementById('a_style').value,
                color: document.getElementById('a_color').value, season: document.getElementById('a_season').value,
                loanDate: document.getElementById('a_loan').value, expected: document.getElementById('a_days').value,
                borrower: document.getElementById('a_borrower').value, confirmerLoan: document.getElementById('a_confirmer').value,
                returnDate: '', returnedBy: '', confirmerReturn: ''
            });
            window.closeModal('actionModal');
        };

        document.getElementById('retForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentRecord) return;
            await window.dbActions.update(currentRecord.id, {
                returnDate: document.getElementById('r_date').value,
                returnedBy: currentRecord.borrower,
                confirmerReturn: document.getElementById('r_conf').value
            });
            window.closeModal('actionModal');
        };

        window.openDel = (id) => {
            document.getElementById('confirmDeleteBtn').onclick = async () => {
                await window.dbActions.delete(id);
                window.closeModal('deleteModal');
            };
            window.openModal('deleteModal');
        };

        window.handleImport = async (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (evt) => {
                const lines = evt.target.result.split(/\r?\n/).filter(l => l.trim());
                for (let l of lines.slice(1)) {
                    const c = l.split(',').map(s => s.replace(/"/g, '').trim());
                    if (c.length < 4) continue;
                    await window.dbActions.add({
                        stt: c[0] || '', brand: c[1] || '', style: c[2] || '', color: c[3] || '', season: c[4] || '',
                        loanDate: c[5] || '', expected: c[6] || '', borrower: c[7] || '', confirmerLoan: c[8] || '',
                        returnDate: c[9] || '', returnedBy: c[10] || '', confirmerReturn: c[11] || ''
                    });
                }
                window.closeModal('importModal');
            };
            reader.readAsText(file, document.getElementById('encoding').value);
        };

        window.exportToCSV = () => {
            const h = "STT(No.),Brand,Style #/Name,Colorway,Season,Loan-out Date,Expected Date,Borrowed by,Confirmed by,Return Date,Returned by,Confirmed by";
            const r = (window.dataStore[window.currentMode] || []).map(i => [i.stt, i.brand, i.style, i.color, i.season, i.loanDate, i.expected, i.borrower, i.confirmerLoan, i.returnDate, i.returnedBy, i.confirmerReturn].join(','));
            const blob = new Blob(["\ufeff" + h + "\n" + r.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `${window.currentMode}_ledger.csv`); link.click();
        };

        function getMD() { const d = new Date(); return `${d.getMonth() + 1}/${d.getDate()}`; }
        initApp();
    </script>

    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
        .filter-select, .filter-input { width: 100%; font-size: 10px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; }
        .table-wrapper { height: calc(100vh - 220px); overflow: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { border-collapse: separate; border-spacing: 0; min-width: 1400px; width: 100%; }
        thead th { position: sticky; top: 0; background: #f8fafc; z-index: 10; border-bottom: 2px solid #e2e8f0; }
        .filter-row th { position: sticky; top: 37px; background: #f8fafc; z-index: 9; border-bottom: 1px solid #e2e8f0; }
        .col-stt { width: 50px; } .col-status { width: 90px; } .col-brand { width: 100px; } .col-style { width: 150px; }
        .col-color { width: 100px; } .col-season { width: 80px; } .col-date { width: 85px; } .col-days { width: 50px; }
        .col-person { width: 120px; } .col-action { width: 100px; }
        .tab-btn { padding: 12px 0; font-weight: 800; font-size: 14px; flex: 1; text-align: center; border-bottom: 2px solid transparent; color: #94a3b8; transition: all 0.3s; cursor: pointer; }
        .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; background: #eff6ff; }
        .action-pane { display: none; padding: 24px; } .action-pane.active { display: block; }
        tr.lent-active { background-color: rgba(255, 247, 237, 0.6); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-2">
    <div class="max-w-full mx-auto">
        <!-- 偵錯診斷框 -->
        <div id="errorLog" class="hidden bg-red-50 border-2 border-red-200 text-red-600 p-4 rounded-xl mb-4 text-xs font-bold whitespace-pre-line shadow-lg"></div>

        <div class="flex flex-col md:flex-row justify-between items-end gap-2 mb-2">
            <div class="flex gap-2">
                <button id="tabConfirm" onclick="switchMode('confirm')" class="px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-blue-600 text-blue-600 transition-all">確認鞋 (Confirm)</button>
                <button id="tabFitting" onclick="switchMode('fitting')" class="px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-500 transition-all">FITTING鞋 (Fitting)</button>
            </div>
            <div id="statPanel" class="flex gap-4 text-[10px] font-bold bg-white px-4 py-1.5 rounded-lg border shadow-sm mb-1">
                <span id="syncIndicator" class="flex items-center gap-1 text-slate-400 transition-colors duration-500"><i data-lucide="cloud-check" class="w-3 h-3"></i> <span id="syncText">正在連線至雲端...</span></span>
                <span class="text-slate-500">總數: <span id="statTotal">0</span></span>
            </div>
        </div>
        
        <div class="bg-white p-3 rounded-xl shadow-sm border mb-4 flex justify-between items-center">
            <div class="flex items-center gap-4 font-black uppercase text-slate-700 tracking-tight"><h1 id="titleDisplay"><i data-lucide="layout-list"></i> 確認鞋管理</h1></div>
            <div class="flex items-center gap-4 text-[11px] font-bold">
                <div class="flex gap-3 border-r pr-4 border-slate-200 text-slate-400 uppercase">
                    <button onclick="exportToCSV()" class="hover:text-emerald-600 transition-all">匯出報表</button>
                    <button onclick="openModal('importModal')" class="hover:text-blue-600 transition-all">匯入資料</button>
                </div>
                <button onclick="openActionModal()" class="flex items-center gap-1.5 bg-blue-600 text-white px-5 py-2 rounded-lg text-xs font-bold hover:bg-blue-700 shadow-md active:scale-95 transition-all tracking-widest"><i data-lucide="plus" class="w-4 h-4"></i> 新增借出</button>
            </div>
        </div>

        <div class="table-wrapper bg-white shadow-inner">
            <table id="mainTable">
                <thead>
                    <tr class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">
                        <th class="p-2 col-stt">STT</th><th class="p-2 col-status">狀態</th><th class="p-2 col-brand">Brand</th><th class="p-2 col-style">Style #</th><th class="p-2 col-color">Color</th><th class="p-2 col-season">Season</th><th class="p-2 col-date">借出日期</th><th class="p-2 col-days">天數</th><th class="p-2 col-person">借用人</th><th class="p-2 col-date">歸還日期</th><th class="p-2 col-person">簽收狀態</th><th class="p-2 col-action text-center">操作</th>
                    </tr>
                    <tr class="filter-row">
                        <th></th>
                        <th><select class="filter-select" onchange="applyFilter(1, this.value)"><option value="">全部</option><option value="外借中">外借中</option><option value="已結案">已結案</option><option value="逾期">逾期</option></select></th>
                        <th><select id="f_brand" class="filter-select" onchange="applyFilter(2, this.value)"></select></th>
                        <th><input type="text" class="filter-input" oninput="applyFilter(3, this.value)" placeholder="搜尋型號"></th>
                        <th><input type="text" class="filter-input" oninput="applyFilter(4, this.value)" placeholder="顏色"></th>
                        <th><select id="f_season" class="filter-select" onchange="applyFilter(5, this.value)"></select></th>
                        <th></th><th></th><th><select id="f_borrower" class="filter-select" onchange="applyFilter(8, this.value)"></select></th>
                        <th></th><th></th><th></th>
                    </tr>
                </thead>
                <tbody id="ledgerBody" class="divide-y divide-slate-100 font-medium"></tbody>
            </table>
            <div id="emptyState" class="p-10 text-center text-slate-300 italic text-xs hidden">目前此類別帳本尚無資料</div>
        </div>
        <p class="text-[10px] text-slate-400 mt-2 italic px-2">提示：對著型體「左鍵雙擊」可快速開啟借還中心。雲端同步已啟動。</p>
    </div>

    <!-- 操作中心彈窗 -->
    <div id="actionModal" class="modal fixed inset-0 bg-black/60 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200">
            <div class="flex border-b border-slate-100 bg-slate-50/50">
                <button id="tabLoan" onclick="switchActionTab('loan')" class="tab-btn active">再次借出</button>
                <button id="tabReturn" onclick="switchActionTab('return')" class="tab-btn">歸還結案</button>
                <button onclick="closeModal('actionModal')" class="px-4 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="px-6 py-3 bg-blue-50/50 border-b border-blue-100 text-xs font-bold flex gap-4"><span id="displayBrand" class="text-blue-800 uppercase tracking-tighter"></span><span id="displayStyle" class="text-blue-600 font-mono tracking-tighter"></span></div>
            <div id="paneLoan" class="action-pane active">
                <form id="addForm" class="grid grid-cols-2 gap-4 text-xs font-semibold text-slate-600">
                    <div class="col-span-1 space-y-1"><label>品牌 Brand</label><input type="text" id="a_brand" class="border p-2.5 w-full rounded outline-none" required></div>
                    <div class="col-span-1 space-y-1"><label>型號 Style #</label><input type="text" id="a_style" class="border p-2.5 w-full rounded outline-none" required></div>
                    <input type="text" id="a_color" placeholder="顏色 Colorway" class="border p-2.5 rounded outline-none">
                    <input type="text" id="a_season" placeholder="季節 Season" class="border p-2.5 rounded outline-none">
                    <input type="text" id="a_loan" placeholder="借出日期" class="border p-2.5 rounded outline-none">
                    <input type="number" id="a_days" placeholder="天數" class="border p-2.5 rounded outline-none">
                    <input type="text" id="a_borrower" placeholder="借用人 (必填)" class="border-2 border-blue-100 p-2.5 rounded focus:border-blue-500 outline-none" required>
                    <input type="text" id="a_confirmer" placeholder="確認簽章" class="border p-2.5 rounded outline-none">
                    <button type="submit" class="col-span-2 bg-blue-600 text-white py-3.5 rounded-xl font-black shadow-lg uppercase tracking-widest active:scale-95 transition-all">確認借出並記錄</button>
                </form>
            </div>
            <div id="paneReturn" class="action-pane">
                <div id="returnStatusNotice" class="hidden p-3 bg-emerald-50 text-emerald-700 mb-4 rounded-lg text-center font-bold text-xs border border-emerald-100 italic">該筆樣鞋已歸還完畢</div>
                <form id="retForm" class="space-y-4 font-semibold text-xs text-slate-600">
                    <div class="bg-slate-50 p-4 rounded-xl flex justify-between border border-slate-100">
                        <span>借用人: <strong id="r_display_borrower"></strong></span>
                        <span>借出日: <strong id="r_display_date"></strong></span>
                    </div>
                    <input type="text" id="r_date" class="w-full border p-3 rounded-xl font-black outline-none" placeholder="實際歸還日期">
                    <input type="text" id="r_conf" class="w-full border p-3 rounded-xl font-black outline-none" value="助理已收">
                    <button type="submit" id="submitReturnBtn" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-black shadow-lg tracking-widest uppercase active:scale-95 transition-all">確認歸還簽收</button>
                </form>
            </div>
        </div>
    </div>
    <div id="deleteModal" class="modal fixed inset-0 bg-black/70 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-2xl text-center">
            <h2 class="font-bold text-lg mb-2 text-slate-800 tracking-tighter">確定要永久刪除嗎？</h2>
            <div class="flex gap-3 mt-6">
                <button onclick="closeModal('deleteModal')" class="flex-1 py-2.5 bg-slate-100 text-slate-500 rounded-lg font-bold text-xs active:scale-95 transition-all">取消</button>
                <button id="confirmDeleteBtn" class="flex-1 py-2.5 bg-red-600 text-white rounded-lg font-bold text-xs shadow-lg active:scale-95 transition-all">確定刪除</button>
            </div>
        </div>
    </div>
    <div id="importModal" class="modal fixed inset-0 bg-black/60 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-xl p-6 shadow-2xl">
            <h2 class="font-bold text-slate-800 mb-4 tracking-tighter">匯入 CSV 歷史資料</h2>
            <select id="encoding" class="w-full mb-4 border p-2.5 rounded font-bold outline-none text-xs"><option value="UTF-8">UTF-8 (預設)</option><option value="Big5">Big5 (Excel)</option></select>
            <input type="file" id="fileIn" class="hidden" accept=".csv" onchange="handleImport(event)">
            <button onclick="document.getElementById('fileIn').click()" class="w-full py-10 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 font-bold hover:bg-slate-50 active:scale-95 transition-all uppercase tracking-widest text-center text-xs">點擊選擇檔案上傳</button>
        </div>
    </div>
</body>
</html>
