<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樣鞋房雙系統管理帳本 (雲端同步版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase 設定區 ---
        const myFirebaseConfig = {
            apiKey: "AIzaSyBEZPT-gedfUMnwSiSuVY4aXuNNqWHxilA",
            authDomain: "shoe-factory-ledger.firebaseapp.com",
            projectId: "shoe-factory-ledger",
            storageBucket: "shoe-factory-ledger.firebasestorage.app",
            messagingSenderId: "380748962069",
            appId: "1:380748962069:web:bb37fe839b5cdf3c86b11c"
        };

        // 環境判斷：優先使用動態配置以修正 api-key-not-valid 報錯
        let firebaseConfig;
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
            } else {
                firebaseConfig = myFirebaseConfig;
            }
        } catch (e) {
            firebaseConfig = myFirebaseConfig;
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'shoe-factory-manager-ledger';
        
        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.dataStore = { confirm: [], fitting: [] };
        window.currentMode = 'confirm';
        window.isAuthReady = false;
        let filters = {};
        let isSyncing = false;

        // 初始化認證程序 (符合 Rule 3)
        async function initApp() {
            const syncText = document.getElementById('syncText');
            try {
                // 如果環境有提供 Token 優先使用，否則執行匿名登入
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        window.isAuthReady = true;
                        if (!isSyncing) {
                            startSyncing();
                            isSyncing = true;
                        }
                    }
                });
            } catch (err) {
                console.error("Auth Error:", err);
                if (syncText) syncText.innerText = "連線失敗：" + (err.code || "金鑰無效");
            }
        }

        // 資料同步監聽 (符合 Rule 1)
        function startSyncing() {
            const syncIndicator = document.getElementById('syncIndicator');
            const syncText = document.getElementById('syncText');
            
            // 嚴格遵守 Rule 1 路徑結構
            const getColl = (mode) => collection(db, 'artifacts', appId, 'public', 'data', `${mode}_ledger`);

            const handleUpdate = (mode, snapshot) => {
                window.dataStore[mode] = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                if (syncIndicator) {
                    syncIndicator.className = "flex items-center gap-1.5 text-emerald-500 font-bold";
                    syncText.innerText = "雲端同步中";
                }
                window.renderTable();
            };

            onSnapshot(getColl('confirm'), (s) => handleUpdate('confirm', s), (e) => {
                console.error("Permission error:", e);
                if (syncText) syncText.innerText = "資料連線權限不足";
            });
            onSnapshot(getColl('fitting'), (s) => handleUpdate('fitting', s));
        }

        // 資料庫封裝
        window.dbActions = {
            async add(data) {
                if (!window.isAuthReady) return;
                const coll = collection(db, 'artifacts', appId, 'public', 'data', `${window.currentMode}_ledger`);
                await addDoc(coll, data);
            },
            async update(id, updates) {
                if (!window.isAuthReady) return;
                const dRef = doc(db, 'artifacts', appId, 'public', 'data', `${window.currentMode}_ledger`, id);
                await updateDoc(dRef, updates);
            },
            async delete(id) {
                if (!window.isAuthReady) return;
                const dRef = doc(db, 'artifacts', appId, 'public', 'data', `${window.currentMode}_ledger`, id);
                await deleteDoc(dRef);
            }
        };

        window.switchMode = function(mode) {
            window.currentMode = mode;
            document.getElementById('tabConfirm').className = (mode === 'confirm') ? 'px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-blue-600 text-blue-600 transition-all' : 'px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-500 transition-all';
            document.getElementById('tabFitting').className = (mode === 'fitting') ? 'px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-orange-600 text-orange-600 transition-all' : 'px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-500 transition-all';
            window.renderTable();
        };

        window.renderTable = function() {
            const body = document.getElementById('ledgerBody');
            if (!body) return;
            body.innerHTML = '';
            const items = window.dataStore[window.currentMode] || [];
            
            items.forEach(r => {
                const isLent = !r.returnDate || r.returnDate.trim() === '';
                const tr = document.createElement('tr');
                tr.className = "cursor-pointer hover:bg-slate-50 text-[11px] border-b";
                if (isLent) tr.classList.add('bg-orange-50/20');
                tr.ondblclick = () => window.openActionModal(r);
                tr.innerHTML = `
                    <td class="p-2.5 text-slate-400 font-mono">${r.stt}</td>
                    <td class="p-2.5">${isLent ? '<span class="text-orange-600 font-bold uppercase text-[9px]">外借中</span>' : '<span class="text-green-600 font-bold uppercase text-[9px]">已結案</span>'}</td>
                    <td class="p-2.5 font-bold text-slate-700">${r.brand || ''}</td>
                    <td class="p-2.5 font-mono text-blue-600 font-bold">${r.style || ''}</td>
                    <td class="p-2.5 text-slate-500">${r.color || ''}</td>
                    <td class="p-2.5 text-slate-400 text-[10px] uppercase">${r.season || ''}</td>
                    <td class="p-2.5 text-slate-400 font-mono">${r.loanDate || ''}</td>
                    <td class="p-2.5 text-center text-slate-300 font-bold">${r.expected || ''}</td>
                    <td class="p-2.5 font-bold text-slate-700">${r.borrower || ''}</td>
                    <td class="p-2.5 text-green-600 font-black">${r.returnDate || '--'}</td>
                    <td class="p-2.5 text-[10px] text-slate-400">${r.returnDate ? `${r.returnedBy}<br>簽: ${r.confirmerReturn}` : '待收'}</td>
                    <td class="p-2.5 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="event.stopPropagation(); window.openActionModal(JSON.parse('${JSON.stringify(r).replace(/'/g, "\\'")}'))" class="text-slate-300 hover:text-blue-600 transition-all"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
                            <button onclick="event.stopPropagation(); window.openDel('${r.id}')" class="text-slate-200 hover:text-red-500 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                `;
                body.appendChild(tr);
            });
            lucide.createIcons();
        }

        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        window.switchActionTab = (tab) => {
            document.getElementById('tabLoan').classList.toggle('active', tab === 'loan');
            document.getElementById('tabReturn').classList.toggle('active', tab === 'return');
            document.getElementById('paneLoan').classList.toggle('active', tab === 'loan');
            document.getElementById('paneReturn').classList.toggle('active', tab === 'return');
        };

        window.openActionModal = function(record = null) {
            document.getElementById('displayStyle').innerText = record ? record.style : '新增記錄';
            if (record) {
                window.currentRecordId = record.id;
                document.getElementById('a_brand').value = record.brand;
                document.getElementById('a_style').value = record.style;
                document.getElementById('a_color').value = record.color;
                document.getElementById('a_season').value = record.season;
                const isRet = record.returnDate && record.returnDate.trim() !== '';
                window.switchActionTab(isRet ? 'loan' : 'return');
                document.getElementById('tabReturn').style.opacity = '1';
                document.getElementById('tabReturn').style.pointerEvents = 'auto';
            } else {
                window.currentRecordId = null;
                document.getElementById('addForm').reset();
                window.switchActionTab('loan');
                document.getElementById('tabReturn').style.opacity = '0.3';
                document.getElementById('tabReturn').style.pointerEvents = 'none';
            }
            window.openModal('actionModal');
        };

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const today = new Date();
            await window.dbActions.add({
                stt: (window.dataStore[window.currentMode]?.length || 0) + 1,
                brand: document.getElementById('a_brand').value,
                style: document.getElementById('a_style').value,
                color: document.getElementById('a_color').value,
                season: document.getElementById('a_season').value,
                loanDate: `${today.getMonth() + 1}/${today.getDate()}`, expected: '2',
                borrower: document.getElementById('a_borrower').value, confirmerLoan: '',
                returnDate: '', returnedBy: '', confirmerReturn: ''
            });
            window.closeModal('actionModal');
        };

        document.getElementById('retForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!window.currentRecordId) return;
            const today = new Date();
            await window.dbActions.update(window.currentRecordId, {
                returnDate: `${today.getMonth() + 1}/${today.getDate()}`,
                returnedBy: '助理代收',
                confirmerReturn: '助理已收'
            });
            window.closeModal('actionModal');
        };

        window.openDel = (id) => {
            document.getElementById('confirmDeleteBtn').onclick = async () => {
                await window.dbActions.delete(id);
                window.closeModal('deleteModal');
            };
            window.openModal('deleteModal');
        };

        initApp();
    </script>

    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
        .table-wrapper { height: calc(100vh - 180px); overflow: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { border-collapse: separate; border-spacing: 0; min-width: 1300px; width: 100%; }
        thead th { position: sticky; top: 0; background: #f8fafc; z-index: 10; border-bottom: 2px solid #e2e8f0; }
        .tab-btn { padding: 12px 0; font-weight: 800; font-size: 14px; flex: 1; text-align: center; border-bottom: 2px solid transparent; color: #94a3b8; transition: all 0.3s; cursor: pointer; }
        .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; background: #eff6ff; }
        .action-pane { display: none; padding: 24px; } .action-pane.active { display: block; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-2">
    <div class="max-w-full mx-auto">
        <div class="flex justify-between items-end mb-2">
            <div class="flex gap-2">
                <button id="tabConfirm" onclick="switchMode('confirm')" class="px-6 py-2 rounded-t-lg font-bold text-sm bg-white border-b-2 border-blue-600 text-blue-600">確認鞋 (Confirm)</button>
                <button id="tabFitting" onclick="switchMode('fitting')" class="px-6 py-2 rounded-t-lg font-bold text-sm bg-slate-200 text-slate-400">Fitting 鞋</button>
            </div>
            <div class="flex gap-4 text-[10px] font-bold bg-white px-4 py-1.5 rounded-lg border shadow-sm mb-1">
                <span id="syncIndicator" class="flex items-center gap-1 text-slate-400 transition-colors duration-500"><i data-lucide="cloud-check" class="w-3 h-3"></i> <span id="syncText">正在連線...</span></span>
                <span class="text-slate-500">總數: <span id="statTotal">0</span></span>
            </div>
        </div>
        
        <div class="bg-white p-3 rounded-xl shadow-sm border mb-4 flex justify-between items-center">
            <h1 class="font-black text-slate-700 uppercase tracking-tight">樣鞋管理帳本</h1>
            <button onclick="openActionModal()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-xs font-bold shadow-md hover:bg-blue-700 active:scale-95 transition-all"><i data-lucide="plus" class="inline w-4 h-4 mr-1"></i> 新增借出</button>
        </div>

        <div class="table-wrapper bg-white shadow-inner border rounded-xl">
            <table id="mainTable">
                <thead>
                    <tr class="text-[10px] font-black text-slate-400 uppercase tracking-tighter bg-slate-50">
                        <th class="p-3 text-left">No.</th><th class="p-3 text-left">狀態</th><th class="p-3 text-left">Brand</th><th class="p-3 text-left">Style #</th><th class="p-3 text-left">Color</th><th class="p-3 text-left">Season</th><th class="p-3 text-left">借出日</th><th class="p-3 text-center">天數</th><th class="p-3 text-left">借用人</th><th class="p-3 text-left">歸還日</th><th class="p-3 text-left">簽收</th><th class="p-3 text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 操作中心彈窗 -->
    <div id="actionModal" class="modal fixed inset-0 bg-black/60 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
            <div class="flex border-b">
                <button id="tabLoan" onclick="switchActionTab('loan')" class="tab-btn active font-black">再次借出</button>
                <button id="tabReturn" onclick="switchActionTab('return')" class="tab-btn font-black">歸還結案</button>
                <button onclick="closeModal('actionModal')" class="px-4 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="px-6 py-3 bg-blue-50/50 text-xs font-bold text-blue-600 flex justify-between items-center border-b">
                <span>目前操作：<strong id="displayStyle" class="text-blue-900"></strong></span>
            </div>
            <div id="paneLoan" class="action-pane active">
                <form id="addForm" class="grid grid-cols-2 gap-4 text-xs font-semibold">
                    <div class="col-span-1 space-y-1"><label>品牌 Brand</label><input type="text" id="a_brand" class="border p-2.5 w-full rounded" required></div>
                    <div class="col-span-1 space-y-1"><label>型號 Style #</label><input type="text" id="a_style" class="border p-2.5 w-full rounded" required></div>
                    <input type="text" id="a_color" placeholder="顏色 Colorway" class="border p-2.5 rounded">
                    <input type="text" id="a_season" placeholder="季節 Season" class="border p-2.5 rounded">
                    <input type="text" id="a_borrower" placeholder="借用人姓名 (必填)" class="col-span-2 border-2 border-blue-100 p-3 rounded focus:border-blue-600 outline-none" required>
                    <button type="submit" class="col-span-2 bg-blue-600 text-white py-3.5 rounded-xl font-black shadow-lg uppercase tracking-widest active:scale-95 transition-all">確認借出並記錄</button>
                </form>
            </div>
            <div id="paneReturn" class="action-pane">
                <div id="returnStatusNotice" class="hidden p-3 bg-emerald-50 text-emerald-700 mb-4 rounded-lg text-center font-bold text-xs border border-emerald-100 italic">該筆樣鞋已歸還完畢</div>
                <div class="bg-slate-50 p-4 rounded-xl flex justify-between border mb-4">
                    <span class="text-xs">借用人: <strong id="r_display_borrower" class="text-slate-800"></strong></span>
                    <span class="text-xs">借出日: <strong id="r_display_date" class="text-slate-800"></strong></span>
                </div>
                <button id="submitReturnBtn" onclick="document.getElementById('retForm').requestSubmit()" class="w-full bg-green-600 text-white py-5 rounded-xl font-black shadow-lg tracking-widest uppercase active:scale-95 transition-all">確認收回 (簽收結案)</button>
                <form id="retForm" class="hidden"></form>
            </div>
        </div>
    </div>

    <!-- 刪除確認 -->
    <div id="deleteModal" class="modal fixed inset-0 bg-black/70 z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-2xl text-center">
            <h2 class="font-bold text-lg mb-6">確定刪除嗎？</h2>
            <div class="flex gap-3">
                <button onclick="closeModal('deleteModal')" class="flex-1 py-2.5 bg-slate-100 rounded-lg font-bold text-xs">取消</button>
                <button id="confirmDeleteBtn" class="flex-1 py-2.5 bg-red-600 text-white rounded-lg font-bold text-xs shadow-lg">刪除</button>
            </div>
        </div>
    </div>
</body>
</html>
